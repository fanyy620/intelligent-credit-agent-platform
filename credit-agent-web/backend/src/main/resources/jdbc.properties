# ====================================================================
# 集中式配置：数据库 / 连接池 / Redis / Agent 服务 / JWT
# 部署时只需要改这一个文件（src/main/resources/jdbc.properties）
# ====================================================================

# ---- MySQL ----
jdbc.driver=com.mysql.cj.jdbc.Driver
jdbc.url=jdbc:mysql://localhost:3306/credit_web?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
jdbc.username=root
jdbc.password=root

# ---- Druid 连接池 ----
druid.initialSize=5
druid.minIdle=5
druid.maxActive=20
druid.maxWait=3000

# ---- Redis ----
redis.host=localhost
redis.port=6379
redis.password=
redis.database=0
redis.maxTotal=20
redis.maxIdle=10
redis.timeout=3000

# ---- Python Agent 服务（src/api_server.py）----
agent.base-url=http://localhost:8000
agent.connect-timeout-ms=2000
agent.read-timeout-ms=15000

# ---- JWT / 登录令牌 ----
# HS256 密钥（生产环境务必更换为足够长的随机串）
jwt.secret=credit-web-jwt-secret-key-please-change-in-production-0123456789
jwt.expire-seconds=7200
